name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*= ([0-9]+).*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION ($CODE)"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure (last 120 lines)"
            tail -n 120 assemble.log
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/aviationdb-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aviationdb-${{ steps.version.outputs.name }}-debug-apk
          path: app/build/outputs/apk/debug/aviationdb-*.apk
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## AviationDB Android build"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})"
            echo "- **Artifact:** \`aviationdb-${{ steps.version.outputs.name }}-debug-apk\`"
            echo "- Uninstall the old app, then install the APK inside that artifact (filename includes version)."
            echo "- In-app: Account screen shows **App version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})**."
            echo "- Debug APK size stays ~30–40MB (MapLibre native libs); use version string, not file size, to confirm updates."
          } >> "$GITHUB_STEP_SUMMARY"